rule_files:
  - /tmp/rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'forecast_wape_7d_store{namespace="freshtrack-prod"}'
        values: '27x30'
      - series: 'forecast_holdout_wape_store{namespace="freshtrack-prod"}'
        values: '17.9x30'
      - series: 'forecast_eval_days_store{namespace="freshtrack-prod"}'
        values: '7x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: ModelDegraded
        exp_alerts: []
      - eval_time: 20m
        alertname: ModelDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              action: retrain
              namespace: freshtrack-prod
            exp_annotations:
              summary: "Live forecast error is more than 1.45x the held-out error"
              description: "Check /model/health. If the data changed, run the retrain workflow (scripts/trigger_retrain.sh)."

  - interval: 1m
    input_series:
      - series: 'forecast_wape_7d_store{namespace="freshtrack-prod"}'
        values: '25.4x30'
      - series: 'forecast_holdout_wape_store{namespace="freshtrack-prod"}'
        values: '17.9x30'
      - series: 'forecast_eval_days_store{namespace="freshtrack-prod"}'
        values: '7x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ModelDegraded
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'forecast_wape_7d_store{namespace="freshtrack-prod"}'
        values: '50x30'
      - series: 'forecast_holdout_wape_store{namespace="freshtrack-prod"}'
        values: '17.9x30'
      - series: 'forecast_eval_days_store{namespace="freshtrack-prod"}'
        values: '2x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ModelDegraded
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'data_drift_psi_store{namespace="freshtrack-prod"}'
        values: '0.13x40 0.40x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: DataDrift
        exp_alerts: []
      - eval_time: 90m
        alertname: DataDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              action: retrain
              namespace: freshtrack-prod
            exp_annotations:
              summary: "Sales pattern has shifted away from the training data (median PSI > 0.25)"
              description: "Run the retrain workflow so the model learns the new pattern; the gates decide if the new model ships."

  - interval: 30s
    input_series:
      - series: 'model_integrity_ok{namespace="freshtrack-prod", pod="backend-abc"}'
        values: '1 1 0 0 0 0 0 0'
      - series: 'model_integrity_ok{namespace="freshtrack-prod", pod="backend-def"}'
        values: '1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: ModelIntegrityFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: freshtrack-prod
              pod: backend-abc
            exp_annotations:
              summary: "backend-abc refused to load a tampered model"
              description: "The model file does not match models/manifest.json. Do not redeploy the same image; check the build that produced it."
