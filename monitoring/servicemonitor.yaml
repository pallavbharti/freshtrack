apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: freshtrack-backend
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - freshtrack-staging
      - freshtrack-prod
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
