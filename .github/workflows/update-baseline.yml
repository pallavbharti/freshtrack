name: Update business-KPI baseline


on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the reference KPIs should change (goes into the PR and the JSON)"
        required: true
      accept_regression:
        description: "Save even if the gate fails (only for a deliberate, reviewed trade-off)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install -r backend/requirements-dev.txt

      - name: Recompute KPIs and write the reference
        working-directory: backend
        env:
          REASON: ${{ inputs.reason }}
          ACCEPT: ${{ inputs.accept_regression }}
        run: |
          if [ "$ACCEPT" = "true" ]; then
            python scripts/policy_gate.py --write-baseline --accept-regression "$REASON" --summary "$GITHUB_STEP_SUMMARY"
          else
            python scripts/policy_gate.py --write-baseline --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          if git diff --quiet -- results/baseline_kpis.json; then
            echo "Reference KPIs unchanged, nothing to do."
            exit 0
          fi
          branch="kpi-baseline/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add results/baseline_kpis.json
          git commit -m "Update business-KPI baseline: $REASON"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update business-KPI baseline" \
            --body "Reason: $REASON

          Generated by the *Update business-KPI baseline* workflow (run ${GITHUB_RUN_ID}). Review the KPI table in the run summary before merging."
