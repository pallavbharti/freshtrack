name: CI/CD


on:
  push:
    branches: [main, "fault/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  backend-tests:
    name: Backend lint + tests + model check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - run: "pip install --only-binary :all: --require-hashes -r requirements-dev.lock"

      - name: Lint
        run: ruff check .

      - name: Lock files match pinned requirements
        run: python scripts/check_lock.py

      - name: Validate training data against main
        run: |
          git fetch --depth=1 origin main 2>/dev/null && git show FETCH_HEAD:backend/data/profile.json > /tmp/ref-profile.json \
            || cp data/profile.json /tmp/ref-profile.json
          python scripts/validate_data.py data/sales.csv --reference /tmp/ref-profile.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Tests
        run: pytest --cov --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/test-results.xml

  business-gate:
    name: Business-KPI gate (waste / fill rate)
    needs: [backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - run: "pip install --only-binary :all: --require-hashes -r requirements-dev.lock"

      - name: Run business-KPI gate
        run: python scripts/policy_gate.py --out ../results/candidate_kpis.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: business-kpis
          path: results/candidate_kpis.json

  monitoring-rules:
    name: Alert rules check + unit tests
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: "3.16.0"
      PROM_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: "pip install --only-binary :all: --require-hashes -r backend/requirements-dev.lock"
      - name: Install promtool (checksum verified)
        run: |
          f="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSLf -o "$f" "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/$f"
          echo "${PROM_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
      - run: |
          python monitoring/extract_rules.py > /tmp/rules.yml
          ./promtool check rules /tmp/rules.yml
          ./promtool test rules monitoring/tests/closed-loop-alerts.test.yml

  frontend-build:
    name: Frontend build + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Tests with coverage
        run: |
          npm test -- --coverage
          sed -i 's#^SF:#SF:frontend/#' coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - run: npm run build

  code-scan:
    name: Static analysis (SonarQube Cloud + Gitleaks + Trivy fs)
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-reports
          path: backend

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Check SonarQube Cloud settings
        id: sonar-cfg
        env:
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_ORG" ] && [ -n "$SONAR_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::SONAR_TOKEN secret and SONAR_ORGANIZATION / SONAR_PROJECT_KEY variables are required on main (README: SonarQube Cloud)"
            exit 1
          else
            echo "::warning::SonarQube Cloud not configured for this run - scan skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Cloud scan
        if: steps.sonar-cfg.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSLf -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="HEAD" .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  build-scan-push:
    name: Build, test, scan, sign image (${{ matrix.service }})
    needs: [backend-tests, business-gate, monitoring-rules, frontend-build, code-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/freshtrack-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Container smoke test
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            docker run -d --name smoke -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/smoke.db "$IMAGE:${{ github.sha }}"
            url=http://localhost:8000
            checks="/ready /forecast/1?days=3"
            login=1
          else
            docker run -d --name smoke -p 8080:8080 --add-host backend:127.0.0.1 "$IMAGE:${{ github.sha }}"
            url=http://localhost:8080
            checks="/healthz /"
          fi
          for i in $(seq 1 30); do curl -sf "$url${checks%% *}" >/dev/null && break; sleep 2; done
          auth=()
          if [ -n "${login:-}" ]; then
            curl -sf -X POST "$url/auth/login" -H 'Content-Type: application/json' \
              -d '{"username":"viewer","password":"viewer-dev-password"}' -o /tmp/login.json || true
            token=$(jq -r '.access_token // empty' /tmp/login.json 2>/dev/null || true)
            auth=(-H "Authorization: Bearer $token")
          fi
          for path in $checks; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' "${auth[@]}" "$url$path")
            echo "$path -> $code"; cat /tmp/out; echo
            [ "$code" = "200" ] || { docker logs smoke; exit 1; }
          done
          docker rm -f smoke

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          digest_ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "DIGEST_REF=$digest_ref" >> "$GITHUB_ENV"
          echo "Pushed \`$digest_ref\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Sign image and attach SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.service }}.spdx.json" "$DIGEST_REF"
          echo "Signed and attested \`$DIGEST_REF\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    needs: [build-scan-push, business-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    environment: staging
    env:
      NAMESPACE: freshtrack-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Deploy (verifies image signatures first)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD }}
        run: ./scripts/deploy.sh "$NAMESPACE" "${{ github.sha }}"
      - name: Smoke test
        env:
          VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD }}
        run: ./scripts/smoke-test.sh "$NAMESPACE"
      - name: Roll back if smoke test failed
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/backend
          kubectl -n "$NAMESPACE" rollout undo deployment/frontend

  deploy-production:
    name: Deploy to production
    needs: [deploy-staging]
    runs-on: [self-hosted, linux]
    environment: production
    env:
      NAMESPACE: freshtrack-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Deploy (verifies image signatures first)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD }}
        run: ./scripts/deploy.sh "$NAMESPACE" "${{ github.sha }}"
      - name: Smoke test
        env:
          VIEWER_PASSWORD: ${{ secrets.VIEWER_PASSWORD }}
        run: ./scripts/smoke-test.sh "$NAMESPACE"
      - name: Roll back if smoke test failed
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/backend
          kubectl -n "$NAMESPACE" rollout undo deployment/frontend
