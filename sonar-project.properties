sonar.projectName=FreshTrack Inventory
sonar.sources=backend/app,backend/scripts,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml
sonar.exclusions=**/node_modules/**,**/dist/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**

sonar.qualitygate.wait=true
