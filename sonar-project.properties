sonar.projectName=FreshTrack Inventory
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,frontend/coverage/**,backend/data/**,backend/models/**,results/**
sonar.coverage.exclusions=backend/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**,frontend/vite.config.js,scripts/**,monitoring/**,backend/scripts/demo_closed_loop.py
sonar.qualitygate.wait=true
